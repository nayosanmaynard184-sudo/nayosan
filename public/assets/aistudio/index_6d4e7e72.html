<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050812">
  <title>Smoke Cursor Effect</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <canvas id="smoke-canvas" aria-hidden="true"></canvas>

  <main class="content">
    <p class="eyebrow">CANVAS PARTICLE EXPERIMENT</p>
    <h1>Follow the smoke.</h1>
    <p class="description">
      Move your pointer across the page to release a soft trail of drifting smoke.
      The effect is made with Canvas 2D and plain JavaScript.
    </p>
    <span class="hint">MOVE YOUR MOUSE OR TOUCH THE SCREEN</span>
  </main>
</body>
</html>
